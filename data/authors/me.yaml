bio: "I am a researcher from Chile and currently a Ph.D. candidate in Urban Studies at the Department of Urbanism at TU Delft. My research focuses on integrating multivariate, multiscalar and longitudinal methods to better undertand the causes, patterns and consequences of urban inequalities.  I am also interested in the role of time and space in the analysis of social stratification and how these concepts can be operationalized in urban analytics.  Please feel free to contact me if you are interested in collaborating!"
